name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MOCK_LLM: "1"                      # PRs never need an API key; see evals-real.yml
  EMBEDDING_BACKEND: onnx
  DEEPEVAL_TELEMETRY_OPT_OUT: "1"
  ANONYMIZED_TELEMETRY: "False"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Validate golden dataset against corpus and tool backends
        run: python scripts/validate_golden.py

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit tests + coverage
        run: pytest tests/unit -q --cov --cov-report=term --cov-report=xml | tee coverage.txt
      - name: Coverage summary
        run: |
          echo "### Unit-test coverage" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^TOTAL" coverage.txt | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  eval-gate:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Cache embedding model and LLM/judge cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/chroma
            .cache/llm
          key: rqg-cache-${{ hashFiles('data/corpus/**', 'data/golden/**', 'src/rqg/rag/prompts.py') }}
          restore-keys: rqg-cache-
      - name: Full golden-set eval (mock mode)
        run: python scripts/run_eval.py --subset full
      - name: Per-case DeepEval suites
        run: deepeval test run tests/evals -q
      - name: Regression gate vs committed baseline
        id: gate
        run: |
          set +e
          python scripts/compare_to_baseline.py
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Safety suite (must-never-succeed attacks are blocking)
        id: safety
        run: |
          set +e
          python scripts/run_safety.py
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          pytest tests/safety -q
          echo "pytest_exit=$?" >> "$GITHUB_OUTPUT"
      - name: SQL data-validation checks (DuckDB)
        run: |
          python scripts/generate_synthetic_logs.py
          python scripts/run_athena_checks.py --local --log-dir data/synthetic_logs --expect-pii 5
          python scripts/run_athena_checks.py --local --log-dir logs --expect-pii 0 --out reports/sql_checks_app_logs.md
      - name: Job summary
        if: always()
        run: |
          cat reports/gate.md >> "$GITHUB_STEP_SUMMARY" || true
          sed -n '1,/## Successful/p' reports/safety.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: |
            reports/latest.md
            reports/latest.json
            reports/gate.md
            reports/safety.md
            reports/sql_checks*.md
      - name: Comment report on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => (fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : `_${p} missing_\n`);
            const kpis = read('reports/latest.md').split('## Per category')[0];
            const safety = read('reports/safety.md').split('## Successful')[0];
            const marker = '<!-- rqg-eval-report -->';
            const body = `${marker}\n${read('reports/gate.md')}\n<details><summary>Eval KPIs</summary>\n\n${kpis}\n</details>\n\n<details><summary>Safety suite</summary>\n\n${safety}\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const prev = comments.find((c) => c.body && c.body.includes(marker));
            if (prev) await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
      - name: Fail on regression or safety failure
        if: always()
        run: |
          test "${{ steps.gate.outputs.exit }}" = "0" || { echo "::error::quality regression (see gate report)"; exit 1; }
          test "${{ steps.safety.outputs.exit }}" = "0" || { echo "::error::must-never-succeed attack succeeded"; exit 1; }
          test "${{ steps.safety.outputs.pytest_exit }}" = "0" || { echo "::error::safety tests failed"; exit 1; }

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
